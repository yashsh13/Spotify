services:
  database:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=spotify
      - POSTGRES_USER=yash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: spotify_database

  cache:
    image: redis:7
    ports:
      - 6379:6379
    command: redis-server --requirepass redispassword
    volumes:
      - redis_data:/data
    container_name: spotify_cache

volumes:
  postgres_data:
  redis_data:
