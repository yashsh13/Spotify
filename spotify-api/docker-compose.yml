services:
  database:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=spotify
      - POSTGRES_USER=yash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: spotify_database

  cache:
    image: redis:7
    ports:
      - 6379:6379
    command: redis-server --requirepass redispassword
    volumes:
      - redis_data:/data
    container_name: spotify_cache

  redis-insight:
    image: redis/redisinsight:3.4
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis-insight_data:/data
    container_name: redis-insight

volumes:
  postgres_data:
  redis_data:
  redis-insight_data:
